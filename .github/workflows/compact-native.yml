name: Compact native qualification
on:
  push:
    branches: [upstream-optimized, main]
    paths: ['compact-integration/**', '.github/workflows/compact-*.yml']
  pull_request:
    paths: ['compact-integration/**', '.github/workflows/compact-*.yml']
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [preview, stable]
        default: preview
permissions:
  contents: read
concurrency:
  group: compact-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      variant: ${{ steps.build.outputs.variant }}
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
      candidate_sha256: ${{ steps.package.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the exact upstream object named by the manifest
        run: |
          upstream=$(python3 -c 'import json; print(json.load(open("compact-integration/manifest.json"))["upstream_commit"])')
          git fetch --no-tags https://github.com/Cisco-Talos/clamav.git "$upstream"
          git show "$upstream:Cargo.lock" > "$RUNNER_TEMP/upstream-Cargo.lock"
      - name: Build the pinned Linux x86-64 toolchain
        run: |
          docker build --platform linux/amd64 -t compact-builder -f compact-integration/release/Dockerfile compact-integration/release
          docker run --platform linux/amd64 --name compact-native --memory=4g --memory-swap=4g -d \
            -v "$PWD:/workspace/repo:ro" -v "$RUNNER_TEMP:/work" compact-builder sleep infinity
          docker exec compact-native git config --global --add safe.directory /workspace/repo
          docker exec compact-native sh -c 'getconf GNU_LIBC_VERSION; rustc --version; cc --version | head -1'
      - name: Materialize exact patches and compile
        id: build
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          if docker exec compact-native python3 /workspace/repo/compact-integration/build.py \
            --output /work/source --build-dir /work/build --configure --build \
            --cmake-option MAINTAINER_MODE=ON --cmake-option ENABLE_MILTER=OFF --cmake-option ENABLE_CLAMONACC=OFF \
            > "$RUNNER_TEMP/logs/build.log" 2>&1; then
            cmp "$RUNNER_TEMP/source/Cargo.lock" "$RUNNER_TEMP/upstream-Cargo.lock"
            echo 'variant=optimized' >> "$GITHUB_OUTPUT"
          else
            # A separate unmodified tree preserves upstream validation on drift.
            docker exec compact-native python3 /workspace/repo/compact-integration/build.py \
              --pristine --output /work/fallback --build-dir /work/fallback-build --configure --build \
              --cmake-option MAINTAINER_MODE=ON --cmake-option ENABLE_MILTER=OFF --cmake-option ENABLE_CLAMONACC=OFF \
              > "$RUNNER_TEMP/logs/fallback-build.log" 2>&1
            docker exec compact-native ctest --test-dir /work/fallback-build -R '^(libclamav|clamscan|sigtool|freshclam)$' --output-on-failure
            echo 'variant=upstream-fallback' >> "$GITHUB_OUTPUT"
            echo 'Optimization drift/build failure: upstream fallback passed; optimized releases remain blocked.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Native, Rust, guard and scanner qualification
        if: steps.build.outputs.variant == 'optimized'
        run: |
          docker exec compact-native python3 /workspace/repo/compact-integration/release/qualify.py \
            --source /work/source --build /work/build --integration /workspace/repo/compact-integration \
            --commit "$GITHUB_SHA" --output /work/qualification.json > "$RUNNER_TEMP/logs/qualification.log" 2>&1
      - name: Offline updater checks under an enforced 512 MiB container limit
        if: steps.build.outputs.variant == 'optimized'
        run: |
          docker network disconnect bridge compact-native
          docker update --memory=512m --memory-swap=512m compact-native
          docker exec compact-native sh -c 'cat /sys/fs/cgroup/memory.max; python3 -m unittest discover -s /workspace/repo/compact-integration/tests -p test_update.py -v' \
            > "$RUNNER_TEMP/logs/bounded-updater.log" 2>&1
          docker exec compact-native ctest --test-dir /work/build -R '^freshclam$' --output-on-failure \
            >> "$RUNNER_TEMP/logs/bounded-updater.log" 2>&1
          docker exec compact-native python3 /workspace/repo/compact-integration/release/run_rust_streaming.py --build /work/build \
            >> "$RUNNER_TEMP/logs/bounded-updater.log" 2>&1
          docker update --memory=4g --memory-swap=4g compact-native
          docker network connect bridge compact-native
      - name: Build the paired pristine upstream control
        if: steps.build.outputs.variant == 'optimized'
        run: |
          docker exec compact-native python3 /workspace/repo/compact-integration/build.py \
            --pristine --output /work/upstream --build-dir /work/upstream-build --configure --build \
            --cmake-option MAINTAINER_MODE=ON --cmake-option ENABLE_MILTER=OFF --cmake-option ENABLE_CLAMONACC=OFF \
            > "$RUNNER_TEMP/logs/upstream-build.log" 2>&1
          docker exec compact-native ctest --test-dir /work/upstream-build -R '^(libclamav|clamscan|sigtool)$' --output-on-failure \
            > "$RUNNER_TEMP/logs/upstream-tests.log" 2>&1
      - name: Collect complete matching source and pending artifacts
        id: package
        if: steps.build.outputs.variant == 'optimized' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          RELEASE_CHANNEL: ${{ inputs.channel || 'preview' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          docker exec compact-native python3 /workspace/repo/compact-integration/release/collect_dependencies.py --enable-deb-src
          docker exec compact-native python3 /workspace/repo/compact-integration/release/versioning.py \
            --build /work/build --revision "$GITHUB_RUN_NUMBER" --output /work/release-version.json
          version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$RUNNER_TEMP/release-version.json")
          tag=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag"])' "$RUNNER_TEMP/release-version.json")
          upstream=$(python3 -c 'import json; print(json.load(open("compact-integration/manifest.json"))["upstream_commit"])')
          python3 compact-integration/release/changelog.py --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --upstream-sha "$upstream" --version "$version" --output "$RUNNER_TEMP/CHANGELOG.md"
          expires=$(( $(date +%s) + 2592000 ))
          docker exec -e GITHUB_RUN_ID compact-native python3 /workspace/repo/compact-integration/release/package.py \
            --source /work/source --build /work/build --output /work/release/candidate --qualification /work/qualification.json \
            --upstream-sha "$upstream" --integration-sha "$GITHUB_SHA" --version "$version" \
            --changelog /work/CHANGELOG.md \
            --repository "$GITHUB_REPOSITORY" --sequence "$GITHUB_RUN_NUMBER" --expires-at "$expires" --channel "$RELEASE_CHANNEL" \
            > "$RUNNER_TEMP/logs/package.log" 2>&1
          sha256sum "$RUNNER_TEMP/release/$tag-candidate.tar.gz" | tee "$RUNNER_TEMP/release/candidate.sha256" >> "$GITHUB_STEP_SUMMARY"
          digest=$(sha256sum "$RUNNER_TEMP/release/$tag-candidate.tar.gz" | cut -d ' ' -f 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "candidate_sha256=$digest" >> "$GITHUB_OUTPUT"
          echo 'Exact candidate qualified; preview publication runs after this job succeeds. Stable publication requires protected promotion.' >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the tested build before transport
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: steps.build.outputs.variant == 'optimized' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          subject-path: |
            ${{ runner.temp }}/release/*candidate.tar.gz
            ${{ runner.temp }}/release/candidate/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() && steps.build.outputs.variant == 'optimized' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          name: compact-native-pending
          path: |
            ${{ runner.temp }}/release/*candidate.tar.gz
            ${{ runner.temp }}/release/candidate.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compact-native-test-evidence
          path: |
            ${{ runner.temp }}/logs/
            ${{ runner.temp }}/qualification.json
            ${{ runner.temp }}/native-resource-qualification.json
            ${{ runner.temp }}/build/Testing/Temporary/
            ${{ runner.temp }}/build/unit_tests/test*.log
      - name: Clean up the isolated builder
        if: always()
        run: docker rm -f compact-native || true
  publish-preview:
    needs: qualification
    if: >-
      needs.qualification.outputs.variant == 'optimized' &&
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch &&
      (inputs.channel || 'preview') == 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: compact-preview
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compact-native-pending
          path: ${{ runner.temp }}/pending
      - name: Verify exact attested qualification artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.qualification.outputs.version }}
          RELEASE_TAG: ${{ needs.qualification.outputs.tag }}
          CANDIDATE_DIGEST: ${{ needs.qualification.outputs.candidate_sha256 }}
        run: |
          commit=$(python3 compact-integration/release/promote.py --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --workflow compact-native.yml --qualification-job qualification --check-run-only)
          test "$commit" = "$GITHUB_SHA"
          gh attestation verify "$RUNNER_TEMP/pending/$RELEASE_TAG-candidate.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/compact-native.yml" \
            --source-ref "refs/heads/${{ github.event.repository.default_branch }}" --source-digest "$commit"
          python3 compact-integration/release/verify_candidate.py \
            --archive "$RUNNER_TEMP/pending/$RELEASE_TAG-candidate.tar.gz" \
            --sha256 "$CANDIDATE_DIGEST" --destination "$RUNNER_TEMP/promotion" \
            --repository "$GITHUB_REPOSITORY" --commit "$commit" \
            --version "$RELEASE_VERSION" --channel preview --tag "$RELEASE_TAG"
      - name: Sign with configured protected preview keys
        id: authentication
        env:
          GH_TOKEN: ${{ github.token }}
          COMPACT_SIGNING_KEY_B64: ${{ secrets.COMPACT_SIGNING_KEY_B64 }}
          RELEASE_PUBLIC_KEY_B64: ${{ vars.COMPACT_RELEASE_PUBLIC_KEY_B64 }}
        run: |
          if [ -n "$COMPACT_SIGNING_KEY_B64" ] || [ -n "$RELEASE_PUBLIC_KEY_B64" ]; then
            test -n "$COMPACT_SIGNING_KEY_B64" && test -n "$RELEASE_PUBLIC_KEY_B64"
            python3 compact-integration/release/check_environment.py --repository "$GITHUB_REPOSITORY" --channel preview
            python3 compact-integration/release/sign.py --manifest "$RUNNER_TEMP/promotion/candidate/manifest.json" \
              --signature "$RUNNER_TEMP/promotion/candidate/manifest.sig" --public-key-b64 "$RELEASE_PUBLIC_KEY_B64"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'Development prerelease: no preview signing keys configured. Strict update clients will reject unsigned artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish immutable prerelease and generated changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLIC_KEY_B64: ${{ vars.COMPACT_RELEASE_PUBLIC_KEY_B64 }}
          RELEASE_SIGNED: ${{ steps.authentication.outputs.signed }}
          RELEASE_TAG: ${{ needs.qualification.outputs.tag }}
        run: |
          args=()
          if [ "$RELEASE_SIGNED" = true ]; then
            args+=(--public-key-b64 "$RELEASE_PUBLIC_KEY_B64")
          else
            args+=(--allow-unsigned-preview)
          fi
          python3 compact-integration/release/promote.py --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --workflow compact-native.yml --qualification-job qualification \
            --candidate "$RUNNER_TEMP/promotion/candidate" "${args[@]}"
          echo "Published [$RELEASE_TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)." >> "$GITHUB_STEP_SUMMARY"
