name: Promote qualified compact artifacts
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful default-branch native qualification run
        required: true
      candidate_sha256:
        description: Exact candidate.tar.gz SHA-256 shown by qualification
        required: true
      version:
        description: Exact candidate version, e.g. 1.6.0-devel-20261118+compact.13
        required: true
      channel:
        type: choice
        options: [preview, stable]
        default: preview
permissions:
  contents: read
concurrency:
  group: compact-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: compact-${{ inputs.channel }}
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate the trusted qualification run
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RUN: ${{ inputs.run_id }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          python3 compact-integration/release/check_environment.py --repository "$GITHUB_REPOSITORY" --channel "$RELEASE_CHANNEL"
          commit=$(python3 compact-integration/release/promote.py --repository "$GITHUB_REPOSITORY" --run-id "$QUALIFIED_RUN" --workflow compact-native.yml --check-run-only)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compact-native-pending
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pending
      - name: Verify the exact candidate without rebuilding
        env:
          CANDIDATE_DIGEST: ${{ inputs.candidate_sha256 }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          QUALIFIED_COMMIT: ${{ steps.qualified.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 - "$RELEASE_VERSION" "$RUNNER_TEMP/pending" <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'compact-integration/release')
          from versioning import native_tag, valid_semver
          version, pending = sys.argv[1:]
          if not valid_semver(version):
              raise ValueError('Invalid release version')
          if (pathlib.Path(pending) / ('clamav-' + version + '-candidate.tar.gz')).is_file():
              print(native_tag(version))
          else:
              print('compact-v' + version)
          PY
          )
          gh attestation verify "$RUNNER_TEMP/pending/$tag-candidate.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/compact-native.yml" \
            --source-ref "refs/heads/${{ github.event.repository.default_branch }}" --source-digest "$QUALIFIED_COMMIT"
          python3 compact-integration/release/verify_candidate.py \
            --archive "$RUNNER_TEMP/pending/$tag-candidate.tar.gz" \
            --sha256 "$CANDIDATE_DIGEST" --destination "$RUNNER_TEMP/promotion" \
            --repository "$GITHUB_REPOSITORY" --commit "$QUALIFIED_COMMIT" \
            --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL" --tag "$tag"
      - name: Sign only after protected environment approval
        env:
          COMPACT_SIGNING_KEY_B64: ${{ secrets.COMPACT_SIGNING_KEY_B64 }}
          RELEASE_PUBLIC_KEY_B64: ${{ vars.COMPACT_RELEASE_PUBLIC_KEY_B64 }}
        run: |
          python3 compact-integration/release/sign.py --manifest "$RUNNER_TEMP/promotion/candidate/manifest.json" \
            --signature "$RUNNER_TEMP/promotion/candidate/manifest.sig" --public-key-b64 "$RELEASE_PUBLIC_KEY_B64"
      - name: Create immutable version tag and signed release
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RUN: ${{ inputs.run_id }}
          RELEASE_PUBLIC_KEY_B64: ${{ vars.COMPACT_RELEASE_PUBLIC_KEY_B64 }}
        run: |
          python3 compact-integration/release/promote.py --repository "$GITHUB_REPOSITORY" \
            --run-id "$QUALIFIED_RUN" --workflow compact-native.yml --candidate "$RUNNER_TEMP/promotion/candidate" \
            --public-key-b64 "$RELEASE_PUBLIC_KEY_B64"
